abel class="form-label">Confirmar senha</label><input type="password" class="form-control" required minlength="4"></div></div><div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="terms" required><label class="form-check-label" for="terms">Concordo com os termos de uso</label></div><button class="btn btn-primary w-100 py-8 fs-4 mb-4 rounded-2" type="submit">Criar conta</button><div class="d-flex align-items-center justify-content-center flex-wrap"><p class="fs-4 mb-0 fw-bold">Já tem conta?</p><a class="text-primary fw-bold ms-2" href="./login.html">Entrar</a></div></form></div></div></div></div></div></div></div><script>document.getElementById('signupForm').addEventListener('submit',e=>{e.preventDefault();const p=e.target.querySelectorAll('input[type=password]');if(p[0].value!==p[1].value){alert('As senhas precisam ser iguais.');return}location.href='./index.html'})</script></body></html>
